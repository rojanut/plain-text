<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Board</title>

    <style>
        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#40ccd6;
            color:#030100;
            font-family:Arial,sans-serif;
        }

        .box{
            width:90%;
            max-width:750px;
            padding:35px;
            text-align:center;
            background:#fafafa;
            border:1px solid #ffffff;
            border-radius:18px;
            box-shadow:0 15px 40px #000000;
        }

        h1{
            margin-bottom:30px;
            letter-spacing:4px;
        }

        .teams{
            display:flex;
            gap:20px;
        }

        .team{
            flex:1;
            padding:25px;
            background:#c5c0c0;
            border:1px solid #444;
            border-radius:12px;
        }

        .score{
            font-size:65px;
            font-weight:bold;
            margin:20px;
        }

        button{
            padding:10px 18px;
            margin:4px;
            border:1px solid #555;
            border-radius:7px;
            background:#111;
            color:#fff;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#fff;
            color:#111;
        }

        .bottom{
            margin-top:25px;
        }

        .winner{
            background:#000000;
            color:#ffffff;
        }

        #result{
            margin-top:20px;
            font-size:22px;
            font-weight:bold;
            min-height:28px;
        }

        @media(max-width:600px){
            .teams{
                flex-direction:column;
            }
        }
    </style>
</head>

<body>

<div class="box">

    <h1>SCORE เปตอง</h1>

    <div class="teams">

        <div class="team">
            <h2>TEAM A</h2>
            <div class="score" id="show"></div>

            <button onclick="add()">+1 team A</button>
            <button onclick="minus()">-1 team A</button>
        </div>

        <div class="team">
            <h2>TEAM B</h2>
            <div class="score" id="show2"></div>

            <button onclick="add2()">+1 team B</button>
            <button onclick="minus2()">-1 team B</button>
        </div>

    </div>

    <div class="bottom">
        <button onclick="reset()">Reset</button>
        <button class="winner" onclick="check()">Winner</button>
    </div>

    <div id="result"></div>

    <script>

        let x = 0;
        let y = 0;
        let gameOver = false;

        function add(){
            if(gameOver) return;

            x++;
            show();
            check();
        }

        function minus(){
            if(gameOver) return;

            if(x > 0){
                x--;
            }

            show();
        }

        function show(){
            document.getElementById('show').innerHTML =
            'Team A: ' + x;
        }


        function add2(){
            if(gameOver) return;

            y++;
            show2();
            check();
        }

        function minus2(){
            if(gameOver) return;

            if(y > 0){
                y--;
            }

            show2();
        }

        function show2(){
            document.getElementById('show2').innerHTML =
            'Team B: ' + y;
        }


        function check(){

            if(x == 13){
                gameOver = true;

                document.getElementById('result').innerHTML =
                'TEAM A WINS!';
            }

            else if(y == 13){
                gameOver = true;

                document.getElementById('result').innerHTML =
                'TEAM B WINS!';
            }
        }


        function reset(){

            x = 0;
            y = 0;
            gameOver = false;

            show();
            show2();

            document.getElementById('result').innerHTML = '';
        }

        show();
        show2();

    </script>

</div>

</body>
</html>
